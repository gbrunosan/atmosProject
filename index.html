<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="script/script.js" defer></script>
</head>
<body>
    <div class="app">
        <form class="containerBusca"> 
            <input autocomplete="off" id="buscaCidade" type="text">
            <img class="icon" src="assets/busca.png" onclick="buscarCidade()">
        </form>
        <div class="containerInfo">
            <div class=temperaturaGrafico>
                <div id="temperaturacidade">
                    <div class="item"><h1 id="numeroTemp">15</h1><p id="celsius">°C</p></div>
                    <div class="item"><span>Três Lagoas</span><img src="/assets/location.svg" id="locationIcon" alt=""></div>
                    <div class="item"><span>Max 36°C - Mín 31°</span><span>Sensação Térmica 32°</span></div>
                </div>
                <div>
                    <div id="divIconClima"><img src="assets/weather.svg" id="iconClima" alt=""></div>
                </div>
            </div>
            <div class="climaStatus">
                <div class="climaStatusItems"><img id="statusIcons" src="/assets/chuva.svg" alt=""><span>Chuva</span>  <span>66%</span></div>
                <div class="climaStatusItems"><img id="statusIcons" src="/assets/umidade.svg" alt=""><span>Umidade</span>  <span>72%</span></div>
                <div class="climaStatusItems"><img id="statusIcons" src="assets/vento.svg" alt=""><span>Vento</span>   <span>15km</span></div>
            </div>
        </div>
            <!-- Chuva umidade vento -->    
    </div>
</body>
</html>
